# multica-artifact-cicd-sync — 编排配置（无凭据）
version: "1.1"

defaults:
  environment: sit       # dev | sit
  append_jira: true

# Issue 前缀 → 默认触发哪些 service（见 multica-platform-jenkins/jobs-catalog.yaml）
issue_service_map:
  acme:
    dev: [acme]
    sit: [acme]
  MSD:
    dev: [mes2, mes-ui-v2]
    sit: [mes2, mes-ui-v2]
  ERP:
    dev: [erp]
    sit: [erp]
  IAM:
    dev: [apisix-v3]
    sit: [apisix-v3]

jira:
  cicd_heading: "h3. CI/CD 部署 (Build / Deploy)"
