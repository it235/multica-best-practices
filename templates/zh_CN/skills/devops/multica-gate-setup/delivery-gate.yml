name: Delivery Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 最小权限原则
permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  gate:
    name: delivery-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 把下面三行换成你仓库真实的验证命令
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

      # 结构化门禁结论：供 Squad 评论引用，杜绝作者自证
      - name: Emit gate conclusion
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            GATE=PASS
          else
            GATE=FAIL
          fi
          echo "GATE=$GATE" >> "$GITHUB_ENV"
          echo "::notice title=Delivery Gate::$GATE"
