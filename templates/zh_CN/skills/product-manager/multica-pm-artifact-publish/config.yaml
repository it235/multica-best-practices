# ============================================
# multica-pm-artifact-publish — PRD 编排默认值（向后兼容）
# Confluence / JIRA 主配置已迁至 platform skills：
#   multica-platform-confluence/config.yaml
#   multica-platform-jira/config.yaml
# 凭据在 .env 或 JIRA_USERNAME / JIRA_PASSWORD 环境变量
# ============================================

version: "1.0"

# ── Confluence 配置
confluence:
  url: "http://your-domain.atlassian.net/wiki:8090"
  default_space: "CRM"
  default_parent_page_id: "125836668"
  spaces:
    - { key: "CRM",          name: "CRM 项目" }
    - { key: "~example-user", name: "个人空间示例" }

# ── JIRA 全局配置
jira:
  url: "http://your-domain.atlassian.net:8080"
  issue_type_id: "10001"   # Story

# ── JIRA 工作流字段（项目可在 projects.<KEY>.workflow_fields 覆盖）
workflow_fields:
  sprint:                 { customId: "10004", type: "number", label: "Sprint",       required: false }
  design_hours:           { customId: "15700", type: "number", label: "设计时间",       required: false }
  test_owner:             { customId: "14301", type: "user",   label: "测试Owner",     required: false }
  estimated_test_date:    { customId: "14303", type: "date",   label: "预计提测时间",   required: false }
  estimated_release_date: { customId: "12500", type: "date",   label: "预计发布日期",   required: false }

# ── JIRA 项目配置
# 核心设计：每个项目的自定义字段通过 fields 映射
# 新增项目只需复制一段配置，修改 customId 即可
projects:

  # ── PROJ 项目
  PROJ:
    id: "18500"
    name: "Angelalign Intellect"
    default_epic: "SCP-201"
    epics:
      - { key: "SCP-201", name: "2026年 - 示例项目" }
    fields:
      need_user:     { customId: "11700", type: "user",   label: "需求人",             required: true }
      background:    { customId: "12200", type: "string", label: "需求背景",            required: true }
      center_source: { customId: "14700", type: "array",  label: "需求来源（中心级）",  required: true }
      region_source: { customId: "16100", type: "object", label: "需求来源（区域）",    required: true }
      req_type:      { customId: "14305", type: "array",  label: "需求类型",            required: true }
      compliance:    { customId: "14602", type: "object", label: "是否涉及合规",        required: true }
      epic_link:     { customId: "10000", type: "string", label: "Epic Link",          required: true }
    field_options:
      center_source:
        - { label: "国内医学",          id: "14100" }
        - { label: "产品研发中心",       id: "12906" }
        - { label: "医学支持&教育中心",  id: "12903" }
        - { label: "国内事业中心",       id: "12900" }
        - { label: "软件研发中心",       id: "12904" }
        - { label: "系统软件中心",       id: "12905" }
      region_source:
        - { label: "国内",     id: "14600" }
        - { label: "集团",     id: "14606" }
        - { label: "海外共享", id: "14601" }
      req_type:
        - { label: "业务需求", id: "12500" }
        - { label: "产品需求", id: "12501" }
        - { label: "技术需求", id: "12502" }
        - { label: "配置需求", id: "14500" }
      compliance:
        - { label: "涉及",   id: "12704" }
        - { label: "不涉及", id: "12705" }

  # ── MDP 项目
  MDP:
    id: "18700"
    name: "主数据平台"
    default_epic: "MDP-81"
    epics:
      - { key: "MDP-81", name: "主数据平台" }
    fields:
      need_user:     { customId: "11700", type: "user",   label: "需求人",             required: true }
      background:    { customId: "12200", type: "string", label: "需求背景",            required: true }
      center_source: { customId: "14700", type: "array",  label: "需求来源（中心级）",  required: true }
      region_source: { customId: "16100", type: "object", label: "需求来源（区域）",    required: true }
      req_type:      { customId: "14305", type: "array",  label: "需求类型",            required: true }
      compliance:    { customId: "14602", type: "object", label: "是否涉及合规",        required: true }
      epic_link:     { customId: "10000", type: "string", label: "Epic Link",          required: true }
    field_options:
      center_source:
        - { label: "产品研发中心", id: "12906" }
        - { label: "软件研发中心", id: "12904" }
        - { label: "系统软件中心", id: "12905" }
      region_source:
        - { label: "国内", id: "14600" }
        - { label: "集团", id: "14606" }
      req_type:
        - { label: "产品需求", id: "12501" }
        - { label: "技术需求", id: "12502" }
        - { label: "配置需求", id: "14500" }
      compliance:
        - { label: "涉及",   id: "12704" }
        - { label: "不涉及", id: "12705" }

# ── 工作流默认值（创建 Story 时的缺省参数）
defaults:
  project: "PROJ"
  center_source: "国内医学"
  region_source: "集团"
  req_type: "业务需求"
  compliance: "不涉及"
  need_user: "<requester-username>"
  background: "无"

# ── 钉钉通知配置（Token 在 .env 中）
dingtalk:
  enabled: true
  project_webhook_map:
    PROJ: "DINGTALK_PROJ_WEBHOOK"
    MDP: "DINGTALK_MDP_WEBHOOK"

# ── PRD 文档模板分区
prd_template:
  sections:
    - "需求背景"
    - "需求目标"
    - "需求范围"
    - "功能详情"
    - "验收标准"
    - "上线时间"
    - "相关链接"
