# multica-platform-jenkins — Jenkins 平台配置（无凭据）
version: "1.1"

jenkins:
  base_url: "http://<JENKINS_URL>"
  curl_resolve: ""  # 例: "<JENKINS_URL>:<JENKINS_INTERNAL_IP>" （若需绑定内网解析）
  timeout_seconds: 1800
  poll_interval_seconds: 5

# dev / sit 环境默认参数（Job 清单见 jobs-catalog.yaml）
environments:
  dev:
    default_branch: master
    # default_params 仅在 --no-auto-params 时使用；正常流程由 Jenkins API 发现参数
    default_params: {}
    deploy_base_url: ""

  sit:
    default_branch: master
    default_params: {}
    deploy_base_url: ""

defaults:
  environment: sit
  branch: master

# 旧 projectmanagement 预设（其他团队可保留；本仓库默认走 jobs-catalog + trigger_env.py）
legacy_profiles:
  sit:
    job_path: "/view/QA/job/qa-sit-projectmanagement"
    default_params:
      env: sit
      token: QA
    projects:
      - projectmanagement-be
      - projectmanagement-fe
      - projectmanagement-scheduler

