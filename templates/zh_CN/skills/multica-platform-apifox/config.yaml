# multica-platform-apifox — 无 token / 无 project secret
version: "1.0"

api_base_url: "https://apifox.example.com"

apifox:
  out_dir: "./apifox-reports"
  default_reporters: "cli,html,json"
  upload_report: true
  env_vars:
    - "baseUrl={{base_url}}"

defaults:
  environment_id: ""

# Issue 前缀 → 默认场景（T3 run_apifox.py）
issue_scenario_map:
  AAI:
    scenario_id: ""
    environment_id: ""
    test_suite_id: ""

# Issue 前缀 → Apifox 项目（OpenAPI 同步时可设 APIFOX_PROJECT_ID 或在此填写）
issue_project_map:
  AAI:
    project_id: ""

# OpenAPI 同步默认分支
import:
  branch: "main"
  delete_orphans: true   # 仅删除带 --tag 且不在本次 OpenAPI 内的 endpoint
